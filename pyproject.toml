[project]
name = "talkingdb-helpers"
version = "1.0.0"
description = "Shared domain helpers for TalkingDB ecosystem"
authors = [
    { name = "immkg", email = "mayank.g@smarter.codes" }
]
readme = "README.md"
requires-python = ">=3.12,<3.14"

[tool.poetry]
packages = [{ include = "talkingdb" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

bcrypt = "^5.0.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
lxml = ">=6.0.0,<7.0.0"

talkingdb-models = { path = "../base-tdb-models", develop = true }
talkingdb-clients = { path = "../base-tdb-clients", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
